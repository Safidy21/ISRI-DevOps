<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <style>
    .password-valide {
      color: green;
      font-weight: bold;
    }

    .password-invalide {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <form id="monFormulaire">
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>
      <p>
        Le mot de passe doit contenir au moins 8 caractères,
        une lettre, un chiffre et un caractère spécial parmi :
        . &amp; # _ -
      </p>
      <p id="passwordFeedback" aria-live="polite"></p>
    </div>
    <button type="submit" id="submitBtn" disabled>S'inscrire</button>
  </form>

  <script>
    function validerMotDePasse(motDePasse) {
      // au moins 8 caractères, au moins une lettre et au moins un chiffre
      const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[.&#_-]).{8,}$/;

      const resultat = regex.test(motDePasse);
      return resultat;
    }

    const inputPassword = document.getElementById('password');
    const passwordFeedback = document.getElementById('passwordFeedback');
    const submitBtn = document.getElementById('submitBtn');

    inputPassword.addEventListener('input', (e) => {
      const motDePasse = e.target.value;
      const estValide = validerMotDePasse(motDePasse);

      if (motDePasse === '') {
        passwordFeedback.textContent = '';
      } else if (estValide) {
        passwordFeedback.textContent = 'Mot de passe valide';
      } else {
        passwordFeedback.textContent = 'Mot de passe invalide';
      }

      submitBtn.disabled = !estValide;

    passwordFeedback.classList.toggle(
      'password-valide',
      motDePasse !== '' && estValide 
    );

    passwordFeedback.classList.toggle(
      'password-invalide',
      motDePasse !== '' && !estValide
    );

    });
  </script>
  
</body>
</html>
